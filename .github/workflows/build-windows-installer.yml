name: Build Biblioteca Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'biblioteca/**'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-windows-installer.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install desktop build tools
        run: npm install --save-dev electron@37.2.6 electron-builder@26.0.12
      - name: Build installer
        run: npx electron-builder --win nsis --x64
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
